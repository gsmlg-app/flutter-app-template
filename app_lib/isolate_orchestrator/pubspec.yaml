name: isolate_orchestrator
description: A generic Dart package that provides a managed pool of long-running isolates with centralized Hub for lifecycle management, type-safe message protocol, health monitoring and automatic restart, consistent hashing router, and request-response correlation with timeout handling.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.8.0 <4.0.0"
resolution: workspace

dependencies:
  meta: any
  logging: any

dev_dependencies:
  test: any
  flutter_lints: ^6.0.0
